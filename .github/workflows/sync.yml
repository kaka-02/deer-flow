name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'      # 每天UTC 0点自动同步
  workflow_dispatch:         # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: tgymnich/fork-sync@v2
        with:
          owner: bytedance
          repo: deer-flow
          base: main    # 你的主分支
          head: main    # 上游主分支
